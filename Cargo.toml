[package]
name = "muthur"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.30", features = ["term", "poll", "fs", "ioctl"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
