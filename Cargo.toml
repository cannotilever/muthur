[package]
name = "muthur"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.30", features = ["term", "poll", "fs", "ioctl", "hostname", "signal", "process", "user", "feature"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
regex = { version = "1", optional = true }
dirs = "6"
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
chrono = "0.4"
unicode-width = "0.2"
deunicode = "1"
vt100 = "0.18"
zeroize = "1"
sysinfo = "0.40"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"

[features]
default = ["agent"]
agent = ["dep:regex"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
